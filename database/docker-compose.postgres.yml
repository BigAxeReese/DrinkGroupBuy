services:
  postgres:
    image: postgres:16-alpine
    container_name: drink-group-buy-postgres-dev
    environment:
      POSTGRES_DB: drink_group_buy
      POSTGRES_USER: drink_group_buy
      POSTGRES_PASSWORD: drink_group_buy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - drink_group_buy_postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drink_group_buy -d drink_group_buy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  drink_group_buy_postgres_data:
